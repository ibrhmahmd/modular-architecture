<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Migrating a module, ticket by ticket</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · references/playbook.md</p>
    <h1>Migrating a module, ticket by ticket</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="migration-playbook-title migration-playbook-desc">
        <title id="migration-playbook-title">Migrating a module, ticket by ticket</title>
        <desc id="migration-playbook-desc">Stage framework of the migration playbook: a one-time setup, then three tickets per module, each listing what it does and what it must prove, repeated bottom-up through the module order with behaviour frozen throughout.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <text x="40" y="108" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">STAGE</text>
        <text x="40" y="152" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">DOES</text>
        <text x="40" y="252" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">PROVES</text>
        <text x="40" y="372" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">ALWAYS</text>
        <line x1="296" y1="108" x2="320" y2="108" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="496" y1="108" x2="520" y2="108" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="696" y1="108" x2="720" y2="108" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M808,80 V56 Q808,48 800,48 H416 Q408,48 408,56 V80" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="568" y="56" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="608" y="65" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NEXT MODULE UP</text>
        <rect x="120" y="80" width="176" height="256" rx="6" fill="#f5f5f5"/>
        <rect x="120" y="80" width="176" height="256" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="132" y="90" width="32" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.5" stroke-width="0.8"/>
        <text x="148" y="99" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SETUP</text>
        <text x="132" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Once per project</text>
        <line x1="132" y1="132" x2="284" y2="132" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <line x1="132" y1="232" x2="284" y2="232" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <text x="132" y="152" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif">Enforcement tests,</text>
        <text x="132" y="168" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif">report-only</text>
        <text x="132" y="184" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif">API snapshot test</text>
        <text x="132" y="200" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif">Baseline of failures</text>
        <text x="132" y="252" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif">Every module listed,</text>
        <text x="132" y="268" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif">enforced set empty</text>
        <text x="132" y="284" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif">Baseline taken on a</text>
        <text x="132" y="300" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif">fresh database</text>
        <rect x="320" y="80" width="176" height="256" rx="6" fill="#f5f5f5"/>
        <rect x="320" y="80" width="176" height="256" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="332" y="90" width="48" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.5" stroke-width="0.8"/>
        <text x="356" y="99" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">TICKET 1</text>
        <text x="332" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">API + facade</text>
        <line x1="332" y1="132" x2="484" y2="132" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <line x1="332" y1="232" x2="484" y2="232" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <text x="332" y="152" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif">Characterize endpoints</text>
        <text x="332" y="168" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif">Move HTTP into api/</text>
        <text x="332" y="184" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif">Build the facade</text>
        <text x="332" y="200" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif">Rewire every caller</text>
        <text x="332" y="252" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif">Snapshot unchanged</text>
        <text x="332" y="268" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif">Char. tests unchanged</text>
        <text x="332" y="284" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif">Route order unchanged</text>
        <text x="332" y="300" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif">No old imports left</text>
        <rect x="520" y="80" width="176" height="256" rx="6" fill="#f5f5f5"/>
        <rect x="520" y="80" width="176" height="256" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="532" y="90" width="48" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.5" stroke-width="0.8"/>
        <text x="556" y="99" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">TICKET 2</text>
        <text x="532" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Workflows up</text>
        <line x1="532" y1="132" x2="684" y2="132" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <line x1="532" y1="232" x2="684" y2="232" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <text x="532" y="152" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif">Cross-module writes</text>
        <text x="532" y="168" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif">move to the highest</text>
        <text x="532" y="184" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif">module, one UoW</text>
        <text x="532" y="200" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif">Add a notifier port</text>
        <text x="532" y="252" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif">Atomicity test:</text>
        <text x="532" y="268" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif">a failed step saves</text>
        <text x="532" y="284" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif">nothing</text>
        <text x="532" y="300" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif">No upward import left</text>
        <rect x="720" y="80" width="176" height="256" rx="6" fill="#f5f5f5"/>
        <rect x="720" y="80" width="176" height="256" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="732" y="90" width="48" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.5" stroke-width="0.8"/>
        <text x="756" y="99" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">TICKET 3</text>
        <text x="732" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Flatten + enforce</text>
        <line x1="732" y1="132" x2="884" y2="132" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <line x1="732" y1="232" x2="884" y2="232" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <text x="732" y="152" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif">Collapse into layers</text>
        <text x="732" y="168" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif">Inject the UoW</text>
        <text x="732" y="184" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif">Repos become classes</text>
        <text x="732" y="200" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif">Delete dead code</text>
        <text x="732" y="252" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif">Zero violations,</text>
        <text x="732" y="268" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif">module enforced</text>
        <text x="732" y="284" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif">Snapshot unchanged</text>
        <text x="732" y="300" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif">Gate = baseline</text>
        <text x="208" y="376" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">creates the yardstick</text>
        <rect x="320" y="356" width="576" height="40" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="336" y="381" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Behaviour-frozen</text>
        <text x="472" y="380" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">same API snapshot, same characterization results, bugs included</text>
        <text x="904" y="452" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="end">a bug fixed in passing is reverted and filed</text>
        <path d="M 848,436 Q 836,416 828,400" fill="none" stroke="rgba(45,49,66,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="828" cy="398" r="2" fill="#2d3142"/>
        <line x1="40" y1="524" x2="920" y2="524" stroke="rgba(45,49,66,0.1)" stroke-width="0.8"/>
        <text x="40" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="558" width="24" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="72" y="568" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Runs once</text>
        <rect x="152" y="558" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="184" y="568" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">One ticket: own branch and review</text>
        <rect x="376" y="558" width="24" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="408" y="568" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Holds for every ticket</text>
        <line x1="548" y1="564" x2="576" y2="564" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="584" y="568" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Next module up, until every module is enforced</text>
      </svg>
    </div>
  </div>
</body>
</html>
